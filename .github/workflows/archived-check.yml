name: Repo Check
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"
jobs:
  check-archived:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for archived repositories
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/Test-ArchivedRepos.ps1
